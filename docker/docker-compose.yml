# ============================================================================
# docker-compose.yml — SHelpDesk Microsoft (DESARROLLO)
# ----------------------------------------------------------------------------
# NOTA: este archivo vive en docker/. Las rutas relativas (build context y
# bind mounts) apuntan al código en la raíz con "../". El .env sigue en la
# raíz: los scripts lo pasan con "--env-file", y en manual:
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
# ============================================================================

# Nombre fijo del proyecto: reutiliza los volúmenes/redes ya existentes
# (shelpdeskmicrosoft_*) aunque el compose ya no esté en la raíz.
name: shelpdeskmicrosoft

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: helpdesk-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Solo accesible desde el host (nunca desde la LAN)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Respaldos pg_dump creados desde el panel del administrador
      - db_backups:/backups
    networks:
      - helpdesk-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      # Solo accesible desde el host (backend/streamlit usan la red interna)
      - "127.0.0.1:11434:11434"
    environment:
      # Mantener los modelos calientes y usar todas las GPU visibles.
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - helpdesk-network
    # Aceleración por GPU NVIDIA. Docker Desktop (WSL2) inyecta /dev/dxg con
    # --gpus all; en Docker Engine nativo usa nvidia-container-runtime.
    # Si el host no tiene GPU NVIDIA, comenta este bloque (Ollama cae a CPU).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build: ../backend
    container_name: helpdesk-backend
    ports:
      - "8000:8000"
    environment:
      # Dentro de la red de Docker se usa el nombre del servicio, no localhost.
      # La app usa un usuario de BD dedicado (no superuser).
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      N8N_CHAT_URL: http://n8n:5678/webhook/chat
      N8N_URL: http://n8n:5678
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AI_CALLBACK_KEY: ${AI_CALLBACK_KEY}
      N8N_API_KEY: ${N8N_API_KEY}
      MAX_TICKETS_AGENTE_DIA: ${MAX_TICKETS_AGENTE_DIA:-3}
      # Orígenes CORS permitidos (separados por coma). Ej: si el frontend está
      # en Vercel: https://helpdesk.midominio.com. Con "*" no se usan cookies.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Proxy Docker de SOLO LECTURA (logs del panel admin). El backend ya no
      # monta el socket: no puede ejecutar comandos ni crear contenedores.
      DOCKER_HOST: http://docker-socket-proxy:2375
      # Superusuario SOLO para pg_dump/pg_restore (respaldos); no se usa para el
      # tráfico normal de la app.
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_DIR: /backups
    volumes:
      # Bind mount: los cambios hechos en ../backend (host) se reflejan en vivo dentro del contenedor
      - ../backend:/app
      # Adjuntos de tickets (PNG/JPG): persisten aunque se recree el contenedor
      - adjuntos_data:/app/uploads
      # Volumen compartido de respaldos (lo escribe pg_dump desde el backend).
      - db_backups:/backups
    depends_on:
      - postgres
      - docker-socket-proxy
    networks:
      - helpdesk-network

  streamlit:
    build:
      context: ..
      dockerfile: streamlit_app/Dockerfile
    container_name: helpdesk-streamlit
    ports:
      # Panel administrativo: SOLO accesible desde el host (no desde la LAN ni
      # Internet). Para acceso remoto, usa el túnel/VPN, nunca publicar 0.0.0.0.
      - "127.0.0.1:8501:8501"
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OLLAMA_URL: http://ollama:11434
      DOCKER_HOST: http://docker-socket-proxy:2375
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_DIR: /backups
    volumes:
      # Bind mount: cambios en ../streamlit_app reflejados en vivo + hot reload de Streamlit
      - ../streamlit_app:/app
      # Volumen compartido de respaldos (los escribe pg_dump desde el panel).
      - db_backups:/backups
    depends_on:
      - postgres
      - docker-socket-proxy
    networks:
      - helpdesk-network

  # Proxy de SOLO LECTURA hacia el socket de Docker (logs/inspección del panel
  # admin). Ni el backend ni el panel montan el socket directamente, así que no
  # pueden crear contenedores ni escapar al host (POST=0 bloquea toda escritura).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: helpdesk-socket-proxy
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - helpdesk-network
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      # Solo accesible desde el host. NOTA: N8N_BASIC_AUTH_* fue eliminado de n8n
      # (>=1.0); la protección del editor es la cuenta owner que se crea en el
      # primer acceso web — asegúrate de completarla.
      - "127.0.0.1:5678:5678"
    environment:
      - WEBHOOK_URL=http://localhost:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n_db}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      # Clave que el workflow de clasificación envía al backend en X-API-Key.
      - AI_CALLBACK_KEY=${AI_CALLBACK_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - helpdesk-network

volumes:
  postgres_data:
  ollama_data:
  n8n_data:
  db_backups:
  adjuntos_data:

networks:
  helpdesk-network:
    driver: bridge