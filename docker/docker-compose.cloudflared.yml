# ============================================================================
# docker-compose.cloudflared.yml — SHelpDesk Microsoft (PRODUCCIÓN por TÚNEL
# Cloudflare) para backend/IA/Streamlit corriendo en TU PC LOCAL.
# ----------------------------------------------------------------------------
# CUÁNDO USARLO: tu frontend está en Vercel y el backend vive en tu máquina
# local sin IP pública ni puertos abiertos (CGNAT / IP dinámica). Cloudflare
# Tunnel hace una conexión SALIENTE hacia Cloudflare; no hay que abrir nada.
#
# ARQUITECTURA:
#   Navegador (Vercel)  --> https://api.tudominio.com  --> Cloudflare edge
#        --> túnel cloudflared (esta máquina) --> http://backend:8000
#   Panel Streamlit      --> https://panel.tudominio.com --> http://streamlit:8501
#
# PASOS (una sola vez, ~5 min):
#   1) Entra a Cloudflare Zero Trust -> Networks -> Tunnels -> "Create a tunnel".
#      Copia el TOKEN del túnel (looks like eyJhIjoi...).
#   2) En ese túnel añade 2 Public Hostnames:
#        - api.tudominio.com    -> service: http://backend:8000
#        - panel.tudominio.com  -> service: http://streamlit:8501
#      (cloudflared corre dentro de la red de compose, por eso valen los
#       nombres de servicio y NO hace falta publicar puertos al host.)
#   3) En tu .env añade:
#        CLOUDFLARE_TUNNEL_TOKEN=eyJhIjoi...
#        CORS_ORIGINS=https://<tu-app>.vercel.app
#        APP_API_BASE_URL=https://api.tudominio.com/api   (para frontend/config.js)
#      (CORS_ORIGINS es el origen de la página Vercel, no el de la API.)
#   4) Detén otros entornos (docker compose down) para no chocar contenedores y:
#        docker compose -f docker/docker-compose.cloudflared.yml --env-file .env up -d --build
#        docker compose -f docker/docker-compose.cloudflared.yml --env-file .env ps
#        docker compose -f docker/docker-compose.cloudflared.yml --env-file .env logs -f cloudflared
#
# NOTA: este archivo vive en docker/; las rutas relativas apuntan a la raíz
# con "../" y el .env sigue en la raíz (los comandos lo pasan con --env-file).
#
# VARIABLES REQUERIDAS en tu .env:
#   CLOUDFLARE_TUNNEL_TOKEN (token del túnel; modo recomendado, gestionado en
#   el panel de Cloudflare).
#   + las habituales: POSTGRES_*, APP_DB_*, JWT_SECRET_KEY, AI_CALLBACK_KEY,
#     N8N_API_KEY, CORS_ORIGINS.
#
# TLS: lo termina Cloudflare (HTTPS público). El backend recibe HTTP interno.
# La IP real del cliente llega en X-Forwarded-For / CF-Connecting-IP, por eso
# TRUST_PROXY=true (lo usa el rate-limiter).
# ============================================================================

# Nombre fijo del proyecto: reutiliza los volúmenes/redes ya existentes
# (shelpdeskmicrosoft_*) aunque el compose ya no esté en la raíz.
name: shelpdeskmicrosoft

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: helpdesk-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_backups:/backups
    networks:
      - helpdesk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - helpdesk-network
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    container_name: n8n
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helpdesk-network
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    container_name: helpdesk-backend
    environment:
      # Red interna: nombres de servicio, no localhost.
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      N8N_CHAT_URL: http://n8n:5678/webhook/chat
      N8N_URL: http://n8n:5678
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AI_CALLBACK_KEY: ${AI_CALLBACK_KEY}
      N8N_API_KEY: ${N8N_API_KEY}
      MAX_TICKETS_AGENTE_DIA: ${MAX_TICKETS_AGENTE_DIA:-3}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Cloudflare inyecta X-Forwarded-For: el rate-limiter confía en él.
      TRUST_PROXY: "true"
    volumes:
      # Socket de Docker: logs y respaldos (pg_dump) del panel administrador.
      # Endurecimiento pendiente (auditoría #3): proxy read-only del socket.
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helpdesk-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  streamlit:
    build:
      context: ..
      dockerfile: streamlit_app/Dockerfile
    container_name: helpdesk-streamlit
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      N8N_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY}
      OLLAMA_URL: http://ollama:11434
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - helpdesk-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # CONECTOR Cloudflare Tunnel (modo RECOMENDADO: token, hostnames gestionados
  # en el panel de Cloudflare Zero Trust).
  # --------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: helpdesk-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN es obligatorio (Cloudflare Zero Trust -> Tunnels)}
    networks:
      - helpdesk-network

  # --------------------------------------------------------------------------
  # VARIANTE OPCIONAL — Túnel gestionado LOCALMENTE (config.yml + credentials).
  # Úsala si prefieres definir los hostnames en un archivo del repo en vez del
  # panel. Pasos: (1) cloudflared tunnel login, (2) cloudflared tunnel create
  # helpdesk  ->  genera ~/.cloudflared/<uuid>.json y un UUID,
  # (3) cloudflared tunnel route dns helpdesk api.tudominio.com (y panel...),
  # (4) copia el JSON a ./cloudflared/credentials.json, crea ./cloudflared/config.yml
  #     con las reglas ingress, (5) define TUNNEL_ID=<uuid> en el .env y
  #     descomenta el bloque de abajo y comenta el servicio cloudflared (token).
  # --------------------------------------------------------------------------
  # cloudflared-local:
  #   image: cloudflare/cloudflared:latest
  #   container_name: helpdesk-cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run ${TUNNEL_ID:?TUNNEL_ID es obligatorio}
  #   volumes:
  #     - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
  #     - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
  #   networks:
  #     - helpdesk-network

volumes:
  postgres_data:
  ollama_data:
  n8n_data:
  db_backups:

networks:
  helpdesk-network:
    driver: bridge
