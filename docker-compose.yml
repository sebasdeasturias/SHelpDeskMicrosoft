services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: helpdesk-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Solo accesible desde el host (nunca desde la LAN)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Respaldos pg_dump creados desde el panel del administrador
      - db_backups:/backups
    networks:
      - helpdesk-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      # Solo accesible desde el host (backend/streamlit usan la red interna)
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - helpdesk-network

  backend:
    build: ./backend
    container_name: helpdesk-backend
    ports:
      - "8000:8000"
    environment:
      # Dentro de la red de Docker se usa el nombre del servicio, no localhost.
      # La app usa un usuario de BD dedicado (no superuser).
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      N8N_CHAT_URL: http://n8n:5678/webhook/chat
      N8N_URL: http://n8n:5678
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AI_CALLBACK_KEY: ${AI_CALLBACK_KEY}
      N8N_API_KEY: ${N8N_API_KEY}
      MAX_TICKETS_AGENTE_DIA: ${MAX_TICKETS_AGENTE_DIA:-3}
      # Orígenes CORS permitidos (separados por coma). Ej: si el frontend está
      # en Vercel: https://helpdesk.midominio.com. Con "*" no se usan cookies.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      # Bind mount: los cambios hechos en ./backend (host) se reflejan en vivo dentro del contenedor
      - ./backend:/app
      # Socket de Docker: logs y respaldos (pg_dump) desde el panel del administrador.
      # PENDIENTE (auditoria #3): proxy read-only del socket como endurecimiento.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
    networks:
      - helpdesk-network

  streamlit:
    build:
      context: .
      dockerfile: streamlit_app/Dockerfile
    container_name: helpdesk-streamlit
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      N8N_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY}
      OLLAMA_URL: http://ollama:11434
    volumes:
      # Bind mount: cambios en ./streamlit_app reflejados en vivo + hot reload de Streamlit
      - ./streamlit_app:/app
      # Socket de Docker para leer logs del sistema (potestad del administrador)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
    networks:
      - helpdesk-network

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      # Solo accesible desde el host. NOTA: N8N_BASIC_AUTH_* fue eliminado de n8n
      # (>=1.0); la protección del editor es la cuenta owner que se crea en el
      # primer acceso web — asegúrate de completarla.
      - "127.0.0.1:5678:5678"
    environment:
      - WEBHOOK_URL=http://localhost:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - helpdesk-network

volumes:
  postgres_data:
  ollama_data:
  n8n_data:
  db_backups:

networks:
  helpdesk-network:
    driver: bridge